name: Helm deploy
description: Config maps from the repo, then helm upgrade --install with the image tag
inputs:
  role: { required: true }
  cluster: { required: true }
  registry: { required: true }
  tag: { required: true }
  backend-role: { required: true }
  values: { required: false, default: "" }
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ap-south-1
    - uses: azure/setup-helm@v4
    - shell: bash
      run: |
        aws eks update-kubeconfig --name ${{ inputs.cluster }} --region ap-south-1
        kubectl create namespace chargegrid --dry-run=client -o yaml | kubectl apply -f -
        # Versioned config/ ships with each release; admin edits live in the database.
        kubectl -n chargegrid create configmap chargegrid-config --from-file=config \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n chargegrid create configmap chargegrid-martin \
          --from-file=martin.yaml=infra/docker/martin/config.yaml \
          --dry-run=client -o yaml | kubectl apply -f -
        extra=""
        if [ -n "${{ inputs.values }}" ]; then extra="-f ${{ inputs.values }}"; fi
        helm upgrade --install chargegrid infra/helm/chargegrid -n chargegrid $extra \
          --set image.registry=${{ inputs.registry }} --set image.tag=${{ inputs.tag }} \
          --set serviceAccount.roleArn=${{ inputs.backend-role }} --wait --timeout 15m
