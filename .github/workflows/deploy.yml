name: Deploy

# main -> build and push images -> staging (Helm) -> smoke test -> prod after approval.
# AWS access uses GitHub OIDC roles from Terraform (no stored keys); the `staging` and
# `prod` GitHub environments hold AWS_DEPLOY_ROLE_ARN, ECR_REGISTRY, EKS_CLUSTER,
# BACKEND_ROLE_ARN and APP_URL, and `prod` requires a reviewer's approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (multi-arch: Graviton nodes)
        run: |
          for app in backend frontend; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              -f $app/Dockerfile.prod -t ${{ vars.ECR_REGISTRY }}/chargegrid-$app:${{ steps.meta.outputs.tag }} \
              --push $app
          done

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          cluster: ${{ vars.EKS_CLUSTER }}
          registry: ${{ vars.ECR_REGISTRY }}
          tag: ${{ needs.build.outputs.tag }}
          backend-role: ${{ vars.BACKEND_ROLE_ARN }}
          values: ""
      - name: Smoke test
        run: |
          curl -fsS ${{ vars.APP_URL }}/health
          test "$(curl -s -o /dev/null -w '%{http_code}' ${{ vars.APP_URL }}/api/v1/runs)" = 401

  prod:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: prod # protected: requires approval
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          cluster: ${{ vars.EKS_CLUSTER }}
          registry: ${{ vars.ECR_REGISTRY }}
          tag: ${{ needs.build.outputs.tag }}
          backend-role: ${{ vars.BACKEND_ROLE_ARN }}
          values: infra/helm/chargegrid/values-prod.yaml
      - name: Smoke test
        run: curl -fsS ${{ vars.APP_URL }}/health
