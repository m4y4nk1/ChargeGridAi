[project]
name = "chargegrid-backend"
version = "0.1.0"
description = "ChargeGrid AI backend — API, engines, agents, ingestion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "tenacity>=9.0",
    "celery>=5.4",
    "redis>=5.1",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "slowapi>=0.1.9",
    "fastapi-users[sqlalchemy]>=14.0",
    "h3>=4.1",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "openpyxl>=3.1",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "ortools>=9.11",
    "simpy>=4.1",
    "anthropic>=1.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "fastembed>=0.7",
    "pypdf>=5.0",
    "lightgbm>=4.5",
    "mlflow-skinny==2.17.2",
    "temporalio>=1.8",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. in argument defaults is the idiomatic
# pattern, not the mutable-default-argument bug B008 warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.mypy.overrides]]
# Celery ships no type hints; its task decorator is the only untyped surface.
module = "app.workers.tasks.*"
disallow_untyped_decorators = false
