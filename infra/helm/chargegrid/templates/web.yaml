apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-frontend
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      volumes: [{ name: tmp, emptyDir: {} }]
      containers:
        - name: web
          image: {{ include "cg.frontendImage" . }}
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          readinessProbe: { httpGet: { path: /, port: http } }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- include "cg.securityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chargegrid-frontend
spec:
  selector: { app.kubernetes.io/component: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-martin
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: martin
spec:
  replicas: {{ .Values.martin.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: martin, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: martin
    spec:
      containers:
        - name: martin
          image: {{ .Values.martin.image }}
          args: ["--config", "/config/martin.yaml"]
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          ports: [{ name: http, containerPort: 3000 }]
          volumeMounts: [{ name: config, mountPath: /config, readOnly: true }]
          resources: {{- toYaml .Values.martin.resources | nindent 12 }}
          {{- include "cg.securityContext" . | nindent 10 }}
      volumes:
        - name: config
          configMap: { name: chargegrid-martin }
---
apiVersion: v1
kind: Service
metadata:
  name: chargegrid-martin
spec:
  selector: { app.kubernetes.io/component: martin, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-valhalla
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: valhalla
spec:
  replicas: {{ .Values.valhalla.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: valhalla, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: valhalla
    spec:
      containers:
        - name: valhalla
          image: {{ .Values.valhalla.image }}
          env:
            - { name: use_tiles_ignore_pbf, value: "True" }
            - { name: build_tar, value: "False" }
          ports: [{ name: http, containerPort: 8002 }]
          volumeMounts: [{ name: tiles, mountPath: /custom_files }]
          readinessProbe: { httpGet: { path: /status, port: http }, initialDelaySeconds: 30 }
          resources: {{- toYaml .Values.valhalla.resources | nindent 12 }}
      volumes:
        - name: tiles
          persistentVolumeClaim: { claimName: {{ .Values.valhalla.tilesPvc }} }
---
apiVersion: v1
kind: Service
metadata:
  name: chargegrid-valhalla
spec:
  selector: { app.kubernetes.io/component: valhalla, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8002, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chargegrid
  labels: {{- include "cg.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: {{ .Values.ingressClass }}
  tls: [{ hosts: [{{ .Values.host | quote }}], secretName: {{ .Values.tlsSecret }} }]
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: chargegrid-api, port: { name: http } } } }
          - { path: /health, pathType: Exact, backend: { service: { name: chargegrid-api, port: { name: http } } } }
          - { path: /tiles, pathType: Prefix, backend: { service: { name: chargegrid-martin, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: chargegrid-frontend, port: { name: http } } } }
