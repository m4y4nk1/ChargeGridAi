apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-api
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: chargegrid
      {{- include "cg.backendVolumes" . | nindent 6 }}
      initContainers:
        - name: migrate
          image: {{ include "cg.backendImage" . }}
          command: ["alembic", "upgrade", "head"]
          {{- include "cg.backendEnv" . | nindent 10 }}
          {{- include "cg.securityContext" . | nindent 10 }}
      containers:
        - name: api
          image: {{ include "cg.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker",
                    "-w", "1", "-b", "0.0.0.0:8000", "--timeout", "120"]
          ports: [{ name: http, containerPort: 8000 }]
          {{- include "cg.backendEnv" . | nindent 10 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "cg.securityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chargegrid-api
  labels: {{- include "cg.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chargegrid-api
  labels: {{- include "cg.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: chargegrid-api }
  minReplicas: {{ .Values.api.hpa.min }}
  maxReplicas: {{ .Values.api.hpa.max }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.cpu }} } }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chargegrid-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }} }
