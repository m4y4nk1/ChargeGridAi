apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-worker
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: chargegrid
      {{- include "cg.backendVolumes" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "cg.backendImage" . }}
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO",
                    "--concurrency={{ .Values.worker.concurrency }}", "--max-tasks-per-child=1"]
          {{- include "cg.backendEnv" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "cg.securityContext" . | nindent 10 }}
{{- if .Values.beat.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-beat
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1   # exactly one scheduler
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: beat, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: chargegrid
      {{- include "cg.backendVolumes" . | nindent 6 }}
      containers:
        - name: beat
          image: {{ include "cg.backendImage" . }}
          command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO",
                    "--schedule", "/tmp/celerybeat-schedule"]
          {{- include "cg.backendEnv" . | nindent 10 }}
          resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { memory: 256Mi } }
          {{- include "cg.securityContext" . | nindent 10 }}
{{- end }}
{{- if .Values.temporalWorker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargegrid-temporal-worker
  labels: {{- include "cg.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: {{ .Values.temporalWorker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: temporal-worker, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: {{- include "cg.labels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-worker
    spec:
      serviceAccountName: chargegrid
      {{- include "cg.backendVolumes" . | nindent 6 }}
      containers:
        - name: temporal-worker
          image: {{ include "cg.backendImage" . }}
          command: ["python", "-m", "app.workflows.worker"]
          {{- include "cg.backendEnv" . | nindent 10 }}
          resources: {{- toYaml .Values.temporalWorker.resources | nindent 12 }}
          {{- include "cg.securityContext" . | nindent 10 }}
{{- end }}
