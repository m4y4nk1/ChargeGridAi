# Vehicle segments and demand-engine parameters (Section 9.2).
#
# Every parameter has:
#   value:        the sourced number — REPLACE_ME until someone supplies one
#   illustrative: a clearly labelled stand-in the engine falls back to
#   source/as_of: where `value` came from
# While any illustrative fallback is used, outputs list it under
# `placeholders_in_use` and the UI shows a warning banner (Section 16).
# The illustrative numbers are order-of-magnitude assumptions for Indian
# urban fleets, NOT sourced estimates.
schema_version: 2

segments:
  e2w:
    label: "e-2W"
    scrappage_rate_annual: { value: REPLACE_ME, illustrative: 0.07, source: REPLACE_ME, as_of: REPLACE_ME }
