# Multipliers on forecast registrations after the last observed month.
adoption_cases:
  slow: { value: REPLACE_ME, illustrative: 0.7, source: REPLACE_ME, as_of: REPLACE_ME }
  base: { value: 1.0, source: "definition: the fitted forecast itself", as_of: 2026-09-25 }
  fast: { value: REPLACE_ME, illustrative: 1.4, source: REPLACE_ME, as_of: REPLACE_ME }


connector_standards:
  - CCS2
  - TYPE2_AC
  - LECCS
  - BHARAT_AC001
  - BHARAT_DC001
  - CHADEMO
  - BATTERY_SWAP


# VAHAN "Vehicle Class" -> our segment (Section 3 "Indian specifics").
# Classes not listed here are rejected by the importer rather than guessed.
vahan_vehicle_class_map:
  "M-CYCLE/SCOOTER": e2w
  "MOPED": e2w
  "MOTORISED CYCLE (CC > 25CC)": e2w
  "E-RICKSHAW(P)": e3w_passenger
  "THREE WHEELER (PASSENGER)": e3w_passenger
  "E-RICKSHAW WITH CART (G)": e3w_goods
  "THREE WHEELER (GOODS)": e3w_goods
  "MOTOR CAR": e4w_private
  "MOTOR CAB": e4w_fleet_taxi
  "MAXI CAB": e4w_fleet_taxi
  "BUS": ebus
  "OMNI BUS": ebus
  "GOODS CARRIER": elcv_etruck

# VAHAN "Fuel" -> EV powertrain type; fuels not listed are non-EV.
vahan_ev_fuel_map:
  "ELECTRIC(BOV)": BEV
  "PURE EV": BEV
  "PLUG-IN HYBRID EV": PHEV
  "STRONG HYBRID EV": HEV
  "FUEL CELL HYDROGEN": FCEV
