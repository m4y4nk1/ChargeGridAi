# Unit costs (₹) for CAPEX/OPEX line items (Section 9.10 of the project brief).
# Every value below is illustrative only until sourced — the UI must show a
# placeholder-in-use warning banner while any REPLACE_ME remains (Section 16).
# `illustrative` values (Phase 6) are round-number stand-ins so the optimiser
# can run; they are NOT quotes. Replace `value` with sourced prices. AC 7 kW
# has no line yet; land lease is excluded from site cost until finance
# (Phase 7) knows each site's footprint.
schema_version: 2

