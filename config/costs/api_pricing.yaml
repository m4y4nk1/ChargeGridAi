# Paid-API unit prices used by the cost guard (backend/app/core/cost_guard.py).
# The guard fails closed: any SKU whose price is REPLACE_ME, or a missing FX
# rate, disables that paid call path entirely until it is filled in.
#
# Google India prices below are from docs/verification.md item 1 (read
# 2026-09-23 from developers.google.com/maps/billing-and-pricing, India
# rates, tier "up to 5M calls"). India rates apply only to India-billed
# accounts — confirm before relying on them.
schema_version: 1

inr_per_usd:
  value: 95.87
  source: Federal Reserve H.10, historical rates for the Indian rupee (noon buying rate)
  as_of: 2026-09-18

providers:
  google_geocoding:
    geocode:
      usd_per_1000: 1.50
      free_units_per_month: 70000
      source: docs/verification.md item 1
      as_of: 2026-09-23
  google_solar:
    # buildingInsights:findClosest only; dataLayers ($30 / 1,000) is never called.
    building_insights:
      usd_per_1000: 4.00
      free_units_per_month: 70000
      source: docs/verification.md item 1
      as_of: 2026-09-23
  google_places:
    search_nearby:
      # Nearby Search Pro (fields: id, displayName, location, types). GLOBAL list price,
      # conservative: India-billed accounts pay the lower India list.
      usd_per_1000: 32.00
      free_units_per_month: 5000
      source: developers.google.com/maps/billing-and-pricing/pricing (global list)
      as_of: 2026-09-27
    search_text:
      usd_per_1000: REPLACE_ME
      free_units_per_month: REPLACE_ME
      source: REPLACE_ME
      as_of: REPLACE_ME
