# Demand calibration (Section 9.2 step 5): a LightGBM model of the residual between
# observed station utilisation (operator feeds, OCPI) and the parametric prediction
# (2SFCA share of catchment demand). The parametric model is never replaced: both
# are logged to MLflow and served side by side.
schema_version: 1

min_stations: 30          # below this, calibration is skipped and the skip is logged
min_days_observed: 28     # a station needs this many days of sessions to count
window_days: 90           # observations used, counted back from the latest session
catchment_minutes: 10     # drive-time catchment for the parametric prediction
folds: 5
seed: 42
experiment: demand-calibration
registered_model: demand_residual_lgbm

lightgbm:
  objective: regression
  learning_rate: 0.05
  num_leaves: 15
  min_data_in_leaf: 5
  feature_fraction: 0.9
  bagging_fraction: 0.9
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 200
  verbose: -1

features:
  - parametric_kwh_per_day
  - charge_points
  - max_kw
  - dc_share
  - catchment_population
  - catchment_evs
  - mean_access_ratio
  - host_type
