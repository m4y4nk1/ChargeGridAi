# Site finance (Section 9.10). Unit costs are in config/costs/unit_costs.yaml
# and grid tariffs in config/tariffs/maharashtra.yaml; this file holds revenue,
# ramp, discounting and the uncertainty model. Numeric parameters use the
# value/illustrative convention and are reported while illustrative.
schema_version: 1

horizon_years: 10
# Pre-tax, real, project-level cash flows (no debt, no depreciation shield).
discount_rate: { value: REPLACE_ME, illustrative: 0.12, source: REPLACE_ME, as_of: REPLACE_ME }

# Price charged to drivers, per kWh, by charger type.
selling_price_inr_per_kwh:
  AC: { value: REPLACE_ME, illustrative: 14, source: REPLACE_ME, as_of: REPLACE_ME }
  DC: { value: REPLACE_ME, illustrative: 20, source: REPLACE_ME, as_of: REPLACE_ME }

# Share of steady-state demand reached in years 1..n while drivers discover the site.
utilisation_ramp: [0.35, 0.6, 0.8, 1.0]
# Annual growth of the site's demand after it reaches steady state.
demand_growth_per_year: { value: REPLACE_ME, illustrative: 0.08, source: REPLACE_ME, as_of: REPLACE_ME }
# Daily utilisation a site can't exceed however much demand grows (queues, dwell).
max_practical_utilisation: { value: REPLACE_ME, illustrative: 0.5, source: REPLACE_ME, as_of: REPLACE_ME }

# Land: bay area per charger, for the lease deposit in unit_costs.yaml.
bay_area_sqm_per_charger: { value: REPLACE_ME, illustrative: 35, source: REPLACE_ME, as_of: REPLACE_ME }
power_factor: 0.95                    # kVA = kW / pf, for demand charges
# kWh delivered to vehicles per kWh bought from the grid (conversion losses).
charger_efficiency: { value: REPLACE_ME, illustrative: 0.93, source: REPLACE_ME, as_of: REPLACE_ME }

# PM E-DRIVE and similar schemes: configurable per request, never assumed.
subsidy:
  eligible_default: false
  # Share of upstream infrastructure (grid connection + transformer) a scheme covers.
  upstream_share: { value: REPLACE_ME, illustrative: 0.8, source: REPLACE_ME, as_of: REPLACE_ME }

# Monte Carlo over uncertain inputs (>= 5,000 draws, brief). Each is a
# triangular multiplier on its base value: [low, mode, high].
monte_carlo:
  draws: 5000
  seed: 20260926
  inputs:
    demand:          { label: "Demand",            low: 0.6,  mode: 1.0, high: 1.3 }
    utilisation_ramp: { label: "Ramp-up speed",    low: 0.7,  mode: 1.0, high: 1.15 }
    selling_price:   { label: "Selling price",     low: 0.85, mode: 1.0, high: 1.1 }
    capex:           { label: "CAPEX",             low: 0.9,  mode: 1.0, high: 1.3 }
    energy_price:    { label: "Grid energy price", low: 0.9,  mode: 1.0, high: 1.25 }

# Named cases: every input at its adverse / central / favourable end together.
cases:
  pessimistic: { demand: low,  utilisation_ramp: low,  selling_price: low,  capex: high, energy_price: high }
  base:        { demand: mode, utilisation_ramp: mode, selling_price: mode, capex: mode, energy_price: mode }
  optimistic:  { demand: high, utilisation_ramp: high, selling_price: high, capex: low,  energy_price: low }
